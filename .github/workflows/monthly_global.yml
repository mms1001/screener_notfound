name: Monthly Global Screener (A/B/C)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional limit for testing (blank = full run)"
        required: false
        default: ""
  schedule:
    - cron: "10 12 1 * *"

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build US universe (required for global)
        run: |
          mkdir -p data/results logs
          python run_all_universes.py --universe us | tee logs/run_us.log

      - name: Run global universe pipeline
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            python run_all_universes.py --universe global --limit "$LIMIT" | tee logs/run.log
          else
            python run_all_universes.py --universe global | tee logs/run.log
          fi


      - name: Email candidates A/B/C
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          python scripts/email_candidates.py || true

      - name: Upload candidates + logs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: candidates-and-logs
          path: |
            data/results/**/candidates_*.csv
            data/results/**/candidates_*.xlsx
            data/results/**/screen_run_*.csv
            data/universe/**
            logs/run.log
            logs/run_us.log
          if-no-files-found: warn
